name: Playwright Tests & Allure Report

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parabank-project
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CI: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install ${{ matrix.browser }} --with-deps

      - name: Run Playwright Tests (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}
        continue-on-error: true

      - name: Upload Allure Raw Results (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: parabank-project/allure-results
          if-no-files-found: warn
          retention-days: 14

  report:
    if: always()
    needs: [test]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parabank-project

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Dependencies
        run: npm install

      - name: Setup Java (required by allure-commandline)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download All Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: parabank-project/allure-results

      - name: Ensure Allure Results Directory
        run: mkdir -p allure-results

      - name: Debug — List allure-results contents
        if: always()
        run: ls -la allure-results || echo "allure-results is EMPTY or MISSING"

      - name: Generate Allure Report
        run: npm run allure:generate
        continue-on-error: true

      - name: Debug — List allure-report contents
        if: always()
        run: ls -la allure-report || echo "allure-report is EMPTY or MISSING"

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: parabank-project/allure-report
          if-no-files-found: warn
          retention-days: 14

      - name: Deploy to GitHub Pages
        if: always() && github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./parabank-project/allure-report
        continue-on-error: true