name: Playwright Tests & Allure Report

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CI: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install Dependencies
        working-directory: parabank-project
        run: npm ci

      - name: Install Playwright Browsers and System Dependencies
        working-directory: parabank-project
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright Tests (${{ matrix.browser }})
        working-directory: parabank-project
        run: npx playwright test --project=${{ matrix.browser }}
        continue-on-error: true

      - name: Upload Allure Raw Results (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: parabank-project/allure-results
          if-no-files-found: warn
          retention-days: 14
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  report:
    if: always()
    needs: [test]
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Java (required by allure-commandline)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        working-directory: parabank-project
        run: npm ci

      - name: Install Allure CLI globally
        run: npm install -g allure-commandline

      - name: Download All Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: parabank-project/allure-results
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Ensure Allure Results Directory
        run: mkdir -p parabank-project/allure-results

      - name: Debug — List allure-results contents
        if: always()
        run: ls -la parabank-project/allure-results || echo "allure-results is EMPTY or MISSING"

      - name: Generate Allure Report
        working-directory: parabank-project
        run: allure generate allure-results --clean -o allure-report

      - name: Debug — List allure-report contents
        if: always()
        run: ls -la parabank-project/allure-report || echo "allure-report is EMPTY or MISSING"

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: parabank-project/allure-report
          if-no-files-found: warn
          retention-days: 14
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Deploy to GitHub Pages
        if: always() && github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./parabank-project/allure-report
        continue-on-error: true